[project]
name = "skill-manager"
version = "0.1.0"
description = "A TUI to list existing skills and interactively create new skills for the agent-plugins repository."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "pyyaml>=6.0",
]

[project.scripts]
skill-manager = "skill_manager.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_manager"]
